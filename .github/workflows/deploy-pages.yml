# Build Quartz from Vault Publishable content and deploy to GitHub Pages.
# Triggers: push to main, or manual workflow_dispatch (after Vault-only edits).
# Does not run on Vault repository events — Obsidian Git sync must not thrash CI.
#
# Required secret (Site repo): VAULT_READ_TOKEN
#   Read-only credential that can clone ridershoot/Blog (private Vault).
# Pages source must be "GitHub Actions" (see ticket 05 wizard).

name: Deploy Personal blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Site
        uses: actions/checkout@v4

      - name: Checkout Vault
        uses: actions/checkout@v4
        with:
          repository: ridershoot/Blog
          token: ${{ secrets.VAULT_READ_TOKEN }}
          path: vault

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches package.json engines.node (>=22); pin a major for CI.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Publishable content (copy mode)
        run: pnpm prepare-content --mode copy --vault vault --content content

      - name: Build Quartz
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
